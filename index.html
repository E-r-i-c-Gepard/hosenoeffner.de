<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hosenöffner.de</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2e2e2e;
            margin: 0;
            min-height: 96vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            text-align: center;
            color: #ffffff;
        }
        main {
            flex: 1;
            font-size: 200%;
        }
        .hero-row {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .hero-row h1,
        .hero-row p {
            margin: 0;
        }
        .site-footer {
            padding: 12px 0;
            color: #ffffff;
        }
        .btn {
            display: inline-block;
            padding: 20px 40px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 300%;
            margin: 0 20px;
            
        }
        .secretbtn {
            display: inline-block;
            padding: 10px 20px;
            background-color: #007bff;
            color: #fff;
            text-decoration: none;
            border-radius: 5px;
            font-size: 100%;
            margin: 20px 0;
            opacity:0;
            transition:0.3s;
        }
        a {
            color: #00b3ff;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        img {
            user-select: none;
        }
        .logo {
            font-size: 200%;
            color: #11c7ff;
            font-family: 'Courier New', Courier, monospace, sans-serif; 
        }
    </style>
</head>
<body>
    <main>
        <div class="hero-row">
            <h1>Welcome to <span class="logo">Hosenöffner.de</span></h1>
            <a href="./pages/quiz.html" class="secretbtn" onmouseover="this.style.opacity='1'" onmouseout="this.style.opacity='0'">Secret Quiz</a>
        </div>
        <p>This is a simple webpage with a few secrets i made for fun :)</p>
        <p>(Try typing "hosenoeffner" or "meme" for example!)</p>
        <div>
        <img src="./images/zipper.png" id="zipper" alt="zipper" style="width: 100px; height: 800px;" draggable="false">
        <img src="./images/slider.png" id="slider" alt="slider" style="width: 100px; height: 200px; position: absolute; left: 50%; transform: translateX(-50%);" draggable="false">
        </div>
    </main>
    <footer class="site-footer">
        <a href="./pages/about.html" class="btn">About Me</a>
        <a href="./pages/wordle.html" class="btn">Play my selfmade Wordle (WIP)</a>
    </footer>
    <script src="./main.js"></script>
</body>
</html>
